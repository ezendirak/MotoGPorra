[project]
name = "motogp-client"
version = "0.1.0"
description = "Cliente Python para la API interna de MotoGP.com"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["motogp_client/tests"]
