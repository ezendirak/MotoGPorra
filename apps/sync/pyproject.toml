[project]
name = "motogporra-sync"
version = "0.1.0"
description = "Servicio de sincronizacion: MotoGP -> Supabase"
requires-python = ">=3.12"
dependencies = [
    "motogp-client",
    "requests>=2.32",
    # Recorta y reescala las fotos de piloto antes de subirlas: el original de
    # MotoGP pesa ~3,8 MB y su CDN no sabe redimensionar. Ver images.py.
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
