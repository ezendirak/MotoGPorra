name: Copia de seguridad

# El plan gratuito de Supabase NO hace copias automáticas: solo las tienen Pro,
# Team y Enterprise. Sin este workflow no habría ningún punto de restauración.
#
# Hace además dos cosas que no son el backup y que importan tanto como él:
#
#  1. Toca la base todas las semanas. Supabase pausa los proyectos gratuitos
#     con poca actividad en 7 días, y en el parón invernal nadie entra.
#  2. Deja actividad en el repositorio. Los `schedule` de Actions se desactivan
#     tras 60 días sin actividad, y la temporada de MotoGP para más de eso.
#     ⚠️ GitHub no documenta si un commit del bot cuenta como actividad. Si no
#     contara, el aviso del paso final es lo que lo delata.

on:
  schedule:
    # Lunes 05:00 UTC, una hora después del sync semanal: así la copia recoge
    # el calendario y los pilotos ya actualizados.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Para el commit del marcador. Nada más.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # El host directo de Postgres de Supabase solo publica registro AAAA, así
      # que solo se alcanza por IPv6. Este paso dice si el runner llega o no,
      # sin imprimir jamás la contraseña.
      - name: Diagnosticar la conexión
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::El secreto SUPABASE_DB_URL no está definido en el repositorio"
            exit 1
          fi

          # Se extraen host y puerto sin tocar usuario ni contraseña.
          sin_esquema="${SUPABASE_DB_URL#*://}"
          hostport="${sin_esquema#*@}"
          host="${hostport%%:*}"
          host="${host%%/*}"
          puerto="${hostport##*:}"
          puerto="${puerto%%/*}"

          echo "host: $host"
          echo "puerto: $puerto"

          echo "--- registros DNS ---"
          echo "A    (IPv4): $(dig +short A "$host" | tr '\n' ' ')"
          echo "AAAA (IPv6): $(dig +short AAAA "$host" | tr '\n' ' ')"

          echo "--- ¿tiene el runner salida IPv6? ---"
          ip -6 addr show scope global | grep -c inet6 || echo "sin direcciones IPv6 globales"

          echo "--- conexión TCP ---"
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$host/$puerto" 2>/dev/null; then
            tcp="responde"
          else
            tcp="NO responde"
          fi
          echo "$tcp"

          # Resumen como anotación: las anotaciones son públicas y consultables
          # por la API, a diferencia de los logs. Ni usuario ni contraseña.
          echo "::warning::diagnostico :: host=$host puerto=$puerto :: A=[$(dig +short A "$host" | tr '\n' ' ')] AAAA=[$(dig +short AAAA "$host" | tr '\n' ' ')] :: ipv6_runner=$(ip -6 addr show scope global 2>/dev/null | grep -c inet6) :: tcp=$tcp"

      # `db dump` falla con un `exit 1` mudo si solo se le deja correr: el
      # detalle se queda en los logs, que exigen autenticación para leerse. Se
      # captura y se emite como ANOTACIÓN, que sí es pública y consultable.
      #
      # ⚠️ Antes de emitirla se borra la contraseña. El mensaje de error de
      # `pg_dump` suele incluir la cadena de conexión entera, y esto es un
      # repositorio público.
      - name: Volcar esquema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          salida=$(supabase db dump --db-url "$SUPABASE_DB_URL" -f esquema.sql 2>&1)
          codigo=$?
          set -e
          [ $codigo -eq 0 ] && exit 0

          # `db dump` se baja una imagen Docker de Postgres para ejecutar
          # pg_dump dentro, y el progreso de la descarga son decenas de líneas.
          # Se filtran y se conserva el FINAL del mensaje: el error va ahí, no
          # al principio.
          limpio=$(printf '%s' "$salida" \
            | grep -vE '^[0-9a-f]{8,}: (Pulling|Waiting|Downloading|Extracting|Verifying|Download complete|Pull complete)' \
            | grep -vE '^[0-9][0-9.]*: Pulling from' \
            | grep -vE '^Digest: |^Status: ' \
            | sed -E 's#(postgres(ql)?://[^:@]+):[^@]*@#\1:CONTRASENA-OCULTA@#g' \
            | tail -c 1500)
          # Las anotaciones son de una sola línea: los saltos van como %0A.
          echo "::error::db dump (codigo $codigo) :: ${limpio//$'\n'/%0A}"
          exit 1

      - name: Volcar datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          salida=$(supabase db dump --db-url "$SUPABASE_DB_URL" --data-only -f datos.sql 2>&1)
          codigo=$?
          set -e
          [ $codigo -eq 0 ] && exit 0

          # `db dump` se baja una imagen Docker de Postgres para ejecutar
          # pg_dump dentro, y el progreso de la descarga son decenas de líneas.
          # Se filtran y se conserva el FINAL del mensaje: el error va ahí, no
          # al principio.
          limpio=$(printf '%s' "$salida" \
            | grep -vE '^[0-9a-f]{8,}: (Pulling|Waiting|Downloading|Extracting|Verifying|Download complete|Pull complete)' \
            | grep -vE '^[0-9][0-9.]*: Pulling from' \
            | grep -vE '^Digest: |^Status: ' \
            | sed -E 's#(postgres(ql)?://[^:@]+):[^@]*@#\1:CONTRASENA-OCULTA@#g' \
            | tail -c 1500)
          echo "::error::db dump --data-only (codigo $codigo) :: ${limpio//$'\n'/%0A}"
          exit 1

      # Un volcado vacío es peor que ninguno: aparenta que hay copia. Si el
      # comando falla a medias o la base está pausada, esto lo detiene aquí.
      - name: Comprobar que la copia no está vacía
        run: |
          for f in esquema.sql datos.sql; do
            tamano=$(stat -c%s "$f")
            echo "$f: $tamano bytes"
            if [ "$tamano" -lt 1000 ]; then
              echo "::error::$f tiene $tamano bytes: la copia no es válida"
              exit 1
            fi
          done
          grep -q "create table" esquema.sql || {
            echo "::error::el esquema no contiene ninguna tabla"; exit 1; }

      # ⚠️ Como ARTEFACTO y nunca commiteado: el repositorio es público y el
      # volcado contiene los datos de los participantes.
      - name: Guardar la copia
        uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_id }}
          path: |
            esquema.sql
            datos.sql
          retention-days: 90

      # El marcador es lo único que se commitea: una fecha, sin datos. Su
      # función es dejar rastro de actividad en el repositorio.
      - name: Anotar la fecha de la última copia
        run: |
          fecha=$(date -u '+%Y-%m-%d %H:%M UTC')
          printf 'Última copia de seguridad: %s\n\nLa genera .github/workflows/backup.yml y se guarda como artefacto de esa ejecución, nunca en el repositorio: contiene datos de los participantes y esto es público.\n' "$fecha" > docs/ULTIMA-COPIA.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ULTIMA-COPIA.md
          # Sin cambios no hay commit: `git commit` fallaría y tumbaría el job.
          git diff --staged --quiet || git commit -m "Copia de seguridad del $fecha"
          # Destino explícito: `checkout` puede dejar el HEAD desacoplado y
          # entonces un `git push` a secas falla por no estar en una rama.
          git push origin HEAD:main
